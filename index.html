<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026精實國際醫療高峰會線上報到系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        #modalBadgeNo { font-size: clamp(3.5rem, 14vw, 8rem); line-height: 0.9; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between antialiased" oncontextmenu="return false;">

    <header class="bg-[#0F348D] text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="text-center sm:text-left">
                <h1 class="text-lg sm:text-xl font-bold tracking-wider">2026精實國際醫療高峰會</h1>
                <p class="text-xs text-blue-200">Lean International Medical Summit 2026</p>
            </div>
            <div class="flex bg-blue-950/50 p-1 rounded-xl shadow-inner border border-blue-800/50">
                <button type="button" id="navCheckinBtn" onclick="switchTab('checkin')" class="px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all shadow-sm bg-white text-[#0F348D]">與會者報到</button>
                <button type="button" id="navAdminBtn" onclick="switchTab('admin')" class="px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-blue-100 hover:text-white">後台管理</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 w-full flex-grow space-y-6">
        <div id="alertBox" class="hidden p-4 rounded-xl text-sm font-medium border shadow-sm transition-all duration-300"></div>

        <!-- 區塊一：與會者報到頁面 -->
        <section id="checkinSection" class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-10 max-w-xl mx-auto space-y-6">
                
                <div id="multiCardBar" class="hidden p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center justify-between">
                    <span id="multiCardCountText" class="text-xs font-bold text-amber-900">已為 0 人完成報到</span>
                    <button type="button" onclick="openSessionCardsModal(0)" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition shadow">🎴 查看所有憑證卡片</button>
                </div>

                <div class="text-center pb-4 border-b border-slate-100">
                    <h2 class="text-xl font-extrabold text-[#0F348D]">線上報到系統</h2>
                    <p class="text-xs text-slate-500 mt-1">請填寫大會編號與完整姓名進行現場報到（可連續幫多人報到）</p>
                </div>

                <form id="checkinForm" onsubmit="handleCheckin(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">大會編號 <span class="text-rose-500">*</span></label>
                        <input type="text" id="badgeNo" required placeholder="例如：001 或 LIM2026-001" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#0F348D] outline-none transition text-sm font-mono bg-slate-50/50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">完整姓名 <span class="text-rose-500">*</span></label>
                        <input type="text" id="fullName" required placeholder="請輸入您的完整姓名" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#0F348D] outline-none transition text-sm bg-slate-50/50">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">當日中午是否用餐 <span class="text-rose-500">*</span></label>
                        <div class="grid grid-cols-3 gap-3">
                            <label class="flex items-center justify-center gap-2 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer"><input type="radio" name="lunch" value="葷食" required class="text-[#0F348D]"><span class="text-xs font-semibold">葷食</span></label>
                            <label class="flex items-center justify-center gap-2 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer"><input type="radio" name="lunch" value="素食" class="text-[#0F348D]"><span class="text-xs font-semibold">素食</span></label>
                            <label class="flex items-center justify-center gap-2 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer"><input type="radio" name="lunch" value="不用餐" class="text-[#0F348D]"><span class="text-xs font-semibold">不用餐</span></label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">教育積分需求（可複選）</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <label class="flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer"><input type="checkbox" name="credits" value="醫師(品質2.4)" class="rounded text-[#0F348D]"><span class="text-xs font-semibold">醫師 (品質 2.4)</span></label>
                            <label class="flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer"><input type="checkbox" name="credits" value="護理師(品質2.4)" class="rounded text-[#0F348D]"><span class="text-xs font-semibold">護理師 (品質 2.4)</span></label>
                            <label class="flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer"><input type="checkbox" name="credits" value="公務人員" class="rounded text-[#0F348D]"><span class="text-xs font-semibold">公務人員</span></label>
                            <label class="flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer"><input type="checkbox" name="credits" value="醫療品質協會" class="rounded text-[#0F348D]"><span class="text-xs font-semibold">醫療品質協會</span></label>
                        </div>
                    </div>

                    <button type="submit" id="submitCheckinBtn" class="w-full py-3.5 bg-[#0F348D] hover:bg-blue-900 text-white font-bold rounded-xl transition shadow text-sm tracking-wide disabled:opacity-50 disabled:cursor-not-allowed">確認送出並產生報到憑證</button>
                </form>

                <div id="reopenCardContainer" class="hidden p-4 bg-blue-50 border border-blue-200 rounded-xl text-center space-y-2">
                    <p id="reopenMsg" class="text-xs text-blue-800 font-medium">此大會編號已經完成報到！</p>
                    <button type="button" onclick="reopenExistingCard()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition shadow">檢視此與會者憑證</button>
                </div>
            </div>
        </section>

        <!-- 區塊二：後台管理頁面 -->
        <section id="adminSection" class="hidden space-y-6">
            <div id="adminLoginCard" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-md mx-auto space-y-6">
                <div class="text-center">
                    <h2 class="text-xl font-bold text-[#0F348D]">後台管理系統登入</h2>
                </div>
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">管理員帳號</label>
                        <input type="text" id="adminUser" required class="w-full px-4 py-2.5 rounded-xl border outline-none text-sm bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">管理員密碼</label>
                        <input type="password" id="adminPass" required class="w-full px-4 py-2.5 rounded-xl border outline-none text-sm bg-slate-50">
                    </div>
                    <button type="submit" class="w-full py-3 bg-[#0F348D] text-white font-bold rounded-xl transition shadow">安全登入後台</button>
                </form>
            </div>

            <div id="adminDashboard" class="hidden space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                    <span class="font-extrabold text-[#0F348D] text-base">管理員控制台</span>
                    <div class="flex flex-wrap gap-2.5 justify-end">
                        <button type="button" onclick="renderTable()" class="px-4 py-2.5 bg-blue-600 text-white rounded-xl text-xs sm:text-sm font-semibold transition shadow">🔄 重新載入名單</button>
                        <button type="button" onclick="handleLogout()" class="px-4 py-2.5 bg-rose-600 text-white rounded-xl text-xs sm:text-sm font-semibold transition shadow">登出</button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                        <h3 class="font-bold text-slate-700 text-base">與會人員暨報到勾稽清單</h3>
                        <span id="recordCount" class="text-xs px-3 py-1 bg-slate-100 text-slate-600 font-bold rounded-full">總計：0 筆</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-xs font-bold uppercase border-b border-slate-100">
                                    <th class="py-4 px-4">大會編號</th>
                                    <th class="py-4 px-4">與會姓名</th>
                                    <th class="py-4 px-4 text-center">報到狀態</th>
                                    <th class="py-4 px-4">報到時間</th>
                                    <th class="py-4 px-4">午餐需求</th>
                                    <th class="py-4 px-4">教育積分</th>
                                    <th class="py-4 px-4 text-center">資料袋狀態</th>
                                    <th class="py-4 px-4">領取人／代領人</th>
                                    <th class="py-4 px-4 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="rosterTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 卡片 Modal -->
    <div id="cardModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-[#0F348D] text-white rounded-3xl p-6 sm:p-8 shadow-2xl relative max-w-md w-full mx-auto text-center border-4 border-white/20 flex flex-col justify-between" style="min-height: 580px;">
            <button type="button" onclick="closeCardModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/20 text-white flex items-center justify-center transition shadow-lg z-10">✕</button>
            <div class="space-y-2 pt-2">
                <p class="text-xs sm:text-sm uppercase tracking-widest text-blue-200 font-bold">2026 精實國際醫療高峰會</p>
                <span id="badgeStatusTag" class="inline-block px-4 py-1.5 bg-emerald-500 text-white text-xs font-extrabold rounded-full shadow">報到憑證已生效</span>
            </div>
            <div class="my-auto py-2 w-full flex flex-col justify-center items-center space-y-1">
                <span class="block text-xs uppercase tracking-widest text-blue-100 font-semibold">與會人員：<strong id="modalAttendeeName" class="text-amber-300 text-sm">--</strong></span>
                <span class="block text-xs uppercase tracking-widest text-blue-200 font-semibold mt-1">專屬大會編號</span>
                <span id="modalBadgeNo" class="font-mono font-black tracking-tight text-white drop-shadow-2xl"></span>
            </div>
            <div class="space-y-3 pb-1">
                <div id="bagNoticeBox" class="bg-white text-[#0F348D] py-2.5 px-4 rounded-xl font-bold text-xs sm:text-sm shadow-md">⚠️ 請向櫃台出示此畫面兌換大會資料袋</div>
                <button type="button" id="claimBagBtn" onclick="openClaimDialog()" class="w-full py-3.5 bg-amber-500 text-slate-900 font-extrabold text-sm sm:text-base rounded-xl transition shadow-xl">🎁 兌換資料袋</button>
                <div id="cardNavControls" class="flex items-center justify-between bg-blue-950/60 p-2 rounded-xl text-xs font-semibold text-blue-200 pt-2 border border-blue-700/50">
                    <button type="button" onclick="navigateCard(-1)" class="px-3 py-1.5 bg-white/10 rounded-lg text-white font-bold">◀ 上一張</button>
                    <span id="cardCounterText" class="font-mono text-amber-300 font-bold">1 / 1</span>
                    <button type="button" onclick="navigateCard(1)" class="px-3 py-1.5 bg-white/10 rounded-lg text-white font-bold">下一張 ▶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 兌換對話框 Modal -->
    <div id="claimModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 space-y-4">
            <div class="text-center">
                <h3 class="text-base font-bold text-[#0F348D]">兌換大會資料袋</h3>
                <p id="claimModalSubText" class="text-xs text-slate-400 mt-1">已自動帶入姓名</p>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">領取人 / 代領人姓名</label>
                <input type="text" id="claimInputName" required class="w-full px-4 py-2.5 rounded-xl border bg-slate-50 font-medium text-slate-800 outline-none focus:ring-2 focus:ring-[#0F348D]">
            </div>
            <div class="flex gap-2.5 pt-1">
                <button type="button" onclick="closeClaimDialog()" class="w-1/2 py-2.5 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl">取消</button>
                <button type="button" id="confirmClaimBtn" onclick="confirmClaimBag()" class="w-1/2 py-2.5 bg-[#0F348D] text-white font-bold text-xs rounded-xl shadow">確認兌換</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygS1xCsG32PBsJm4FmlDMCieLOd9ecbvY96FfnYViBehrMyC_94hfe6XkE9_LGP_or/exec";

        let cachedAttendees = [];
        let lastCheckedBadge = '';
        let sessionBadges = [];
        let currentCardIndex = 0;

        window.addEventListener('DOMContentLoaded', () => { fetchCloudAttendees(); });

        // 智慧配對函數：解決前台 001 後台為 1 造成的找不到人錯誤
        function isBadgeMatch(val1, val2) {
            let s1 = String(val1).trim();
            let s2 = String(val2).trim();
            if (s1 === s2) return true;
            if (s1 !== "" && s2 !== "" && !isNaN(s1) && !isNaN(s2) && Number(s1) === Number(s2)) return true;
            return false;
        }

        async function fetchCloudAttendees() {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL + '?t=' + new Date().getTime());
                const data = await res.json();
                if (Array.isArray(data)) cachedAttendees = data;
            } catch (err) { console.warn('抓取雲端資料延遲'); }
        }

        // 核心修復：強制使用 text/plain 防止 CORS 被阻擋，確保資料絕對寫入！
        async function sendToCloud(payload) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                return true;
            } catch (err) {
                console.error('雲端同步失敗', err);
                return false;
            }
        }

        function switchTab(tab) {
            document.getElementById('checkinSection').classList.toggle('hidden', tab !== 'checkin');
            document.getElementById('adminSection').classList.toggle('hidden', tab !== 'admin');
            if(tab === 'admin') renderTable();
            hideAlert();
        }

        function showAlert(msg, type = 'success') {
            const box = document.getElementById('alertBox');
            box.textContent = msg;
            box.className = `p-4 rounded-xl text-sm font-medium border shadow-sm transition-all duration-300 ${type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 5000);
        }
        function hideAlert() { document.getElementById('alertBox').classList.add('hidden'); }

        function maskName(name) {
            if (!name) return '';
            let len = name.length;
            if (len === 2) return name[0] + 'O';
            if (len === 3) return name[0] + 'O' + name[2];
            if (len === 4) return name[0] + 'OO' + name[3];
            if (len > 4) return name[0] + 'O'.repeat(len - 2) + name[len - 1];
            return name;
        }

        function formatCheckinTime(timeStr) {
            if (!timeStr || timeStr === '未報到') return '未報到';
            const d = new Date(timeStr);
            if (isNaN(d.getTime())) return timeStr;
            return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        }

        async function handleCheckin(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitCheckinBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true; submitBtn.innerHTML = `⏳ 同步寫入雲端中...`;

            try {
                const badgeNo = document.getElementById('badgeNo').value.trim();
                const fullName = document.getElementById('fullName').value.trim();
                const lunch = document.querySelector('input[name="lunch"]:checked').value;
                const credits = Array.from(document.querySelectorAll('input[name="credits"]:checked')).map(cb => cb.value).join(', ') || '無';

                await fetchCloudAttendees();
                let target = cachedAttendees.find(a => isBadgeMatch(a.badgeNo, badgeNo));
                
                if (!target) { showAlert('找不到此大會編號！', 'error'); return; }
                if (target.maskedName !== maskName(fullName)) { showAlert('編號與姓名不符！', 'error'); return; }
                if (target.isCheckedIn) {
                    lastCheckedBadge = badgeNo;
                    showAlert('此編號已經完成報到！', 'error');
                    document.getElementById('reopenCardContainer').classList.remove('hidden');
                    return;
                }

                const timeNow = new Date().toString();
                target.fullName = fullName; target.isCheckedIn = true;
                target.checkinTime = timeNow; target.lunch = lunch; target.credits = credits;

                if (!sessionBadges.includes(badgeNo)) sessionBadges.push(badgeNo);
                
                // 【修復 1】將報到精確寫入雲端
                await sendToCloud({ action: "updateCheckin", badgeNo: badgeNo, isCheckedIn: true, checkinTime: timeNow, lunch: lunch, credits: credits });
                
                document.getElementById('multiCardBar').classList.toggle('hidden', sessionBadges.length === 0);
                document.getElementById('multiCardCountText').textContent = `已為 ${sessionBadges.length} 人完成報到`;
                document.getElementById('reopenCardContainer').classList.add('hidden');
                
                openSessionCardsModal(sessionBadges.indexOf(badgeNo));
                document.getElementById('checkinForm').reset();
                showAlert('🎉 報到成功！已同步至雲端', 'success');
            } catch(err) {
                showAlert('報到失敗，請重試', 'error');
            } finally {
                submitBtn.disabled = false; submitBtn.innerHTML = originalText;
            }
        }

        function reopenExistingCard() {
            if (lastCheckedBadge) {
                if (!sessionBadges.includes(lastCheckedBadge)) sessionBadges.push(lastCheckedBadge);
                openSessionCardsModal(sessionBadges.indexOf(lastCheckedBadge));
            }
        }

        function openSessionCardsModal(idx) {
            if (sessionBadges.length === 0) return;
            currentCardIndex = Math.max(0, Math.min(idx, sessionBadges.length - 1));
            renderCardByIndex(currentCardIndex);
            document.getElementById('cardModal').classList.remove('hidden');
            document.getElementById('cardModal').classList.add('flex');
        }

        function renderCardByIndex(idx) {
            const badge = sessionBadges[idx];
            let target = cachedAttendees.find(a => isBadgeMatch(a.badgeNo, badge));
            if(!target) return;

            document.getElementById('modalBadgeNo').textContent = target.badgeNo;
            document.getElementById('modalAttendeeName').textContent = target.fullName || target.maskedName;

            const claimBtn = document.getElementById('claimBagBtn');
            const noticeBox = document.getElementById('bagNoticeBox');
            
            if (target.isBagClaimed) {
                claimBtn.disabled = true;
                claimBtn.className = "w-full py-3.5 bg-slate-300 text-slate-600 font-bold rounded-xl cursor-not-allowed";
                claimBtn.innerHTML = `✅ 已領取資料袋 (${target.claimedBy || '已兌換'})`;
                noticeBox.textContent = `⚠️ 此憑證已完成資料袋兌換`;
            } else {
                claimBtn.disabled = false;
                claimBtn.className = "w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-900 font-extrabold rounded-xl transition shadow-xl";
                claimBtn.innerHTML = `🎁 兌換資料袋`;
                noticeBox.textContent = `⚠️ 請向櫃台出示此畫面兌換大會資料袋`;
            }

            document.getElementById('cardCounterText').textContent = `${idx + 1} / ${sessionBadges.length}`;
            document.getElementById('cardNavControls').classList.toggle('hidden', sessionBadges.length <= 1);
            document.getElementById('cardNavControls').classList.toggle('flex', sessionBadges.length > 1);
        }
        function navigateCard(dir) { openSessionCardsModal(currentCardIndex + dir); }
        function closeCardModal() { document.getElementById('cardModal').classList.add('hidden'); document.getElementById('cardModal').classList.remove('flex'); }

        // 【修復 3】代領人預設邏輯：第一張填自己，第二張開始鎖定「第一個報到者」的名字
        function openClaimDialog() {
            if (sessionBadges.length === 0) return;
            
            const currentBadgeNo = sessionBadges[currentCardIndex];
            const currentTarget = cachedAttendees.find(a => isBadgeMatch(a.badgeNo, currentBadgeNo));
            
            const firstBadgeNo = sessionBadges[0];
            const firstTarget = cachedAttendees.find(a => isBadgeMatch(a.badgeNo, firstBadgeNo));
            const firstName = firstTarget ? firstTarget.fullName : "";

            let defaultName = "";
            if (currentCardIndex === 0) {
                defaultName = currentTarget ? currentTarget.fullName : "";
                document.getElementById('claimModalSubText').textContent = "已自動帶入本卡與會人姓名";
            } else {
                defaultName = firstName;
                document.getElementById('claimModalSubText').textContent = `已自動帶入第一位報到者 (${firstName}) 作為代領人`;
            }
            
            document.getElementById('claimInputName').value = defaultName;
            document.getElementById('claimModal').classList.remove('hidden');
            document.getElementById('claimModal').classList.add('flex');
        }
        function closeClaimDialog() { document.getElementById('claimModal').classList.add('hidden'); document.getElementById('claimModal').classList.remove('flex'); }

        // 【修復 4】兌換資料袋寫入雲端
        async function confirmClaimBag() {
            const inputName = document.getElementById('claimInputName').value.trim();
            if (!inputName) { alert('請輸入領取人姓名！'); return; }

            const currentBadgeNo = sessionBadges[currentCardIndex];
            const confirmBtn = document.getElementById('confirmClaimBtn');
            confirmBtn.disabled = true; confirmBtn.textContent = "⏳ 寫入雲端中...";

            try {
                await sendToCloud({ action: "claimBag", badgeNo: currentBadgeNo, isBagClaimed: true, claimedBy: inputName });
                
                let target = cachedAttendees.find(a => isBadgeMatch(a.badgeNo, currentBadgeNo));
                if (target) { target.isBagClaimed = true; target.claimedBy = inputName; }

                closeClaimDialog();
                renderCardByIndex(currentCardIndex);
                showAlert(`🎉 兌換成功！已寫入試算表。`, 'success');
                if(!document.getElementById('adminSection').classList.contains('hidden')) renderTable();
            } catch (e) {
                showAlert('連線雲端失敗', 'error');
            } finally {
                confirmBtn.disabled = false; confirmBtn.textContent = "確認兌換";
            }
        }

        // 【修復 2】後台取消與報到按鈕即時寫入雲端
        async function toggleCheckinStatus(badgeNo) {
            let target = cachedAttendees.find(a => isBadgeMatch(a.badgeNo, badgeNo));
            if (!target) return;
            
            const newStatus = !target.isCheckedIn;
            const newTime = newStatus ? new Date().toString() : '未報到';
            const newLunch = newStatus ? (target.lunch === '未填寫' ? '現場櫃台協助' : target.lunch) : '未填寫';
            const newCredits = newStatus ? (target.credits === '未填寫' ? '人工勾稽' : target.credits) : '未填寫';

            target.isCheckedIn = newStatus; target.checkinTime = newTime; target.lunch = newLunch; target.credits = newCredits;
            
            await sendToCloud({ action: "updateCheckin", badgeNo: badgeNo, isCheckedIn: newStatus, checkinTime: newTime, lunch: newLunch, credits: newCredits });
            
            renderTable();
            showAlert(`已將編號 ${badgeNo} 改為 ${newStatus ? '已報到' : '未報到'}！`, 'success');
        }

        async function toggleBagClaimStatus(badgeNo) {
            let target = cachedAttendees.find(a => isBadgeMatch(a.badgeNo, badgeNo));
            if (!target) return;
            const newStatus = !target.isBagClaimed;
            let claimedBy = target.claimedBy;
            if (newStatus && !claimedBy) {
                const name = prompt(`請輸入資料袋領取人姓名：`, target.fullName);
                if (name === null) return;
                claimedBy = name.trim() || target.fullName;
            } else if (!newStatus) claimedBy = '';
            
            target.isBagClaimed = newStatus; target.claimedBy = claimedBy;
            await sendToCloud({ action: "claimBag", badgeNo: badgeNo, isBagClaimed: newStatus, claimedBy: claimedBy });
            renderTable();
            showAlert(`已更新編號 ${badgeNo} 領取狀態！`, 'success');
        }

        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('adminUser').value.trim() === 'twlean' && document.getElementById('adminPass').value.trim() === 'lean25553000!') {
                document.getElementById('adminLoginCard').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                renderTable();
            } else { showAlert('帳號密碼錯誤', 'error'); }
        }
        function handleLogout() {
            document.getElementById('adminLoginCard').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('loginForm').reset();
        }

        async function renderTable() {
            await fetchCloudAttendees();
            const tbody = document.getElementById('rosterTableBody');
            document.getElementById('recordCount').textContent = `總計：${cachedAttendees.length} 筆`;
            tbody.innerHTML = cachedAttendees.length === 0 ? `<tr><td colspan="9" class="p-8 text-center text-slate-400">目前無資料</td></tr>` : '';
            
            cachedAttendees.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors";
                const safeBadge = String(item.badgeNo).replace(/'/g, "\\'");
                tr.innerHTML = `
                    <td class="py-4 px-4 font-mono font-bold">${item.badgeNo}</td>
                    <td class="py-4 px-4">${item.maskedName}</td>
                    <td class="py-4 px-4 text-center">${item.isCheckedIn ? '<span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">已報到</span>' : '<span class="px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-bold">未報到</span>'}</td>
                    <td class="py-4 px-4 text-slate-500 text-xs">${formatCheckinTime(item.checkinTime)}</td>
                    <td class="py-4 px-4 text-xs">${item.lunch}</td><td class="py-4 px-4 text-xs">${item.credits}</td>
                    <td class="py-4 px-4 text-center">${item.isBagClaimed ? `<button onclick="toggleBagClaimStatus('${safeBadge}')" class="px-3 py-1 bg-emerald-600 text-white rounded-full text-xs font-bold shadow-sm">已領取</button>` : `<button onclick="toggleBagClaimStatus('${safeBadge}')" class="px-3 py-1 bg-slate-200 text-slate-700 rounded-full text-xs font-bold">未領取</button>`}</td>
                    <td class="py-4 px-4 text-xs">${item.claimedBy || '<span class="text-slate-400">-</span>'}</td>
                    <td class="py-4 px-4 text-center space-x-1.5 whitespace-nowrap">
                        <button onclick="toggleCheckinStatus('${safeBadge}')" class="px-3 py-1.5 bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold shadow-sm">${item.isCheckedIn ? '取消' : '設為已報到'}</button>
                    </td>`;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
